<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Courses</title>

  <link rel="stylesheet" href="./style.css" />

  <script defer src="./script.js"></script>
</head>

<body>

  <h1>Courses</h1>

  <h2>EPITA — Computer Science</h2>

  <section>
    <div id="Course-list"></div>
  </section>

  <!-- ADD COURSE -->

  <form id="Course-form">

    <input
      id="title"
      placeholder="Course title"
      required
    />

    <input
      id="teacher"
      placeholder="Teacher"
      required
    />

    <input
      id="credits"
      placeholder="Credits"
      type="number"
      required
    />

    <input
      id="description"
      placeholder="Description"
      required
    />

    <button type="submit">
      Add Course
    </button>

  </form>

  <!-- EDIT MODAL -->

  <div
    id="editModal"
    style="
      display:none;
      position:fixed;
      top:20%;
      left:35%;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    "
  >

    <h3>Edit Course</h3>

    <input
      id="editTitle"
      placeholder="Title"
    />

    <br><br>

    <input
      id="editTeacher"
      placeholder="Teacher"
    />

    <br><br>

    <input
      id="editCredits"
      placeholder="Credits"
      type="number"
    />

    <br><br>

    <input
      id="editDescription"
      placeholder="Description"
    />

    <br><br>

    <button onclick="saveEdit()">
      Save
    </button>

    <button onclick="closeEdit()">
      Cancel
    </button>

  </div>

</body>
</html>
